# Runs the automated tests on every push and pull request, including files uploaded
# through GitHub's website, so a broken update shows a red ✗ on the commit.
name: Tests
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
      # Use the Google Chrome that GitHub's Ubuntu runners already have (no browser download).
      - run: npm test
        env:
          PW_CHANNEL: chrome
